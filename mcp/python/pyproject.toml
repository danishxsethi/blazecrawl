[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blazecrawl-mcp"
version = "0.1.2"
description = "MCP server for BlazeCrawl Core (scrape/map/crawl tools)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mcp", "model-context-protocol", "web-scraping", "crawler", "llm", "ai-agents", "self-hosted"]
dependencies = ["mcp>=1.0.0,<3.0.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/danishxsethi/blazecrawl"
Repository = "https://github.com/danishxsethi/blazecrawl"
Issues = "https://github.com/danishxsethi/blazecrawl/issues"
Documentation = "https://github.com/danishxsethi/blazecrawl/tree/main/mcp/python"

[project.scripts]
blazecrawl-mcp = "blazecrawl_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["blazecrawl_mcp"]
